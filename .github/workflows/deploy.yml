name: Build and Push to GitHub Container Registry

on:
  push:
    branches: [ main ]

# Required so GitHub Actions has permission to publish images to GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        run: |
          docker build -t ghcr.io/shravan403/repotracker-mvp:latest \
                       -t ghcr.io/shravan403/repotracker-mvp:${{ github.sha }} .
          docker push ghcr.io/shravan403/repotracker-mvp:latest
          docker push ghcr.io/shravan403/repotracker-mvp:${{ github.sha }}
          echo "Image successfully pushed to GHCR"